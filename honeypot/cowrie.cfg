# Overrides for the official cowrie/cowrie image. Anything not set here keeps
# Cowrie's defaults (etc/cowrie.cfg.dist inside the image).

[honeypot]
# What attackers see. Pick something that looks like a forgotten server.
hostname = srv-db01
# Name in the "sensor" column; without it Cowrie uses the container id.
sensor_name = hp-eastus-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
# Keep sessions alive long enough to capture full scripts, but not forever.
interactive_timeout = 300
authentication_timeout = 120
# Payloads fetched with wget/curl in the fake shell are saved here (see detections/hunting/captured_payloads.kql).

[shell]
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux
arch = linux-x64-lsb

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
# Disable tunnelling so the sensor cannot be used as a proxy.
forwarding = false
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false

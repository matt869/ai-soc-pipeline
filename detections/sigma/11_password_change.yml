title: Account password change
id: 5d2e8b3c-4f5a-5b6c-9d8e-0f1a2b3c4d5e
status: experimental
description: A session changed an account password (chpasswd, usermod -p) to lock out the owner or keep access. Mirrors detections/kql/11_password_change.kql.
author: matt869
date: 2026-10-21
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: cowrie
    service: ssh
detection:
    selection_event:
        eventid: cowrie.command.input
    selection_pw:
        input|contains:
            - chpasswd
            - usermod -p
    condition: all of selection_*
fields:
    - src_ip
    - session
    - input
falsepositives:
    - Operators resetting a honeypot account
level: high

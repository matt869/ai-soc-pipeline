title: Credential file access
id: 7f4a0d2e-6b5c-5d8e-9f0a-1b2c3d4e5f6a
status: experimental
description: A session read a hashed-password file (/etc/shadow, /etc/gshadow) to dump credentials for cracking or reuse. Mirrors detections/kql/12_credential_file_access.kql.
author: matt869
date: 2026-10-21
tags:
    - attack.credential-access
    - attack.t1003.008
logsource:
    product: cowrie
    service: ssh
detection:
    selection_event:
        eventid: cowrie.command.input
    selection_shadow:
        input|contains:
            - /etc/shadow
            - /etc/gshadow
    condition: all of selection_*
fields:
    - src_ip
    - session
    - input
falsepositives:
    - Unlikely on a honeypot
level: high
